name: Weekly Ranking Snapshot

on:
  schedule:
    # SBI updates weekly — capture every Monday 10:00 JST (01:00 UTC)
    - cron: "0 1 * * 1"
    # Rakuten updates monthly ~2nd — capture on the 3rd at 10:00 JST
    - cron: "0 1 3 * *"
  workflow_dispatch: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv sync

      - name: Download existing DB
        run: gh release download db-latest -p nisa.db -D /tmp || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ranking pipeline
        run: uv run python -m pynisa._internal.pipeline_cli --db /tmp/nisa.db --delay 0.5

      - name: Upload DB to release
        run: |
          gh release upload db-latest /tmp/nisa.db --clobber 2>/dev/null || \
          gh release create db-latest /tmp/nisa.db \
            --title "NISA Ranking Database" \
            --notes "Weekly NISA ranking snapshot. Auto-updated by GitHub Actions."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
