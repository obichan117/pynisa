[project]
name = "pynisa"
version = "0.2.0"
description = "Fetch NISA account trading rankings from major Japanese securities brokerages"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "obichan117" }]
keywords = ["nisa", "japan", "stocks", "securities", "ranking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.0",
]

[project.scripts]
nisa = "pynisa._internal.cli.app:main"

[project.urls]
Homepage = "https://github.com/obichan117/pynisa"
Documentation = "https://obichan117.github.io/pynisa/"
Repository = "https://github.com/obichan117/pynisa"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pynisa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.35",
    "mkdocs-material>=9.0",
    "ruff>=0.9",
]
